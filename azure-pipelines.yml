trigger:
- main

pool:
  vmImage: ubuntu-latest

stages: 
  - stage: TerraformPlan
    jobs:
      - job: Validate
        steps:
          - task: TerraformInstaller@1
            displayName: "Terraform install"
            inputs:
              terraformVersion: 'latest'
          - task: TerraformTask@5
            displayName: "Terraform Init"
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'sc_azuredevops'
              backendAzureRmStorageAccountName: 'examplestorageacctnsajda'
              backendAzureRmContainerName: 'terraform-files'
              backendAzureRmKey: 'terraform-allfiles'
          - task: TerraformTask@5
            displayName: "Terraform Validate"
            inputs:
              provider: 'azurerm'
              command: 'validate'
          - task: TerraformTask@5
            displayName: "Terraform Plan"
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: 'sc_azuredevops'
              arguments: '-out=$(Build.ArtifactStagingDirectory)/tfplan'
          
          # FIX: Publish the entire staging directory instead of the specific file path
          - task: PublishBuildArtifacts@1
            displayName: "Publish Plan Artifact"
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'

  - stage: tfdeploy
    condition: succeeded ('TerraformPlan')
    dependsOn: TerraformPlan
    jobs:
      - job: TerraformApply
        steps:
          - task: TerraformInstaller@1
            displayName: "Terraform install"
            inputs:
              terraformVersion: 'latest'
          - task: DownloadBuildArtifacts@1
            displayName: "Download Plan Artifact"
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'drop'
              downloadPath: '$(System.DefaultWorkingDirectory)'
          - task: TerraformTask@5
            displayName: "Terraform Init"
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'sc_azuredevops'
              backendAzureRmStorageAccountName: 'examplestorageacctnsajda'
              backendAzureRmContainerName: 'terraform-files'
              backendAzureRmKey: 'terraform-allfiles'
          
          # FIX: Reference the exact structural path where the file lands after extraction
          - task: TerraformTask@5
            displayName: "Terraform Apply"
            inputs:
              provider: 'azurerm'
              command: 'apply'
              environmentServiceNameAzureRM: 'sc_azuredevops'
              arguments: '$(System.DefaultWorkingDirectory)/drop/tfplan'
