# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

stages: 
  - stage: TerraformPlan
    jobs:
      - job: Validate
        steps:
          - task: TerraformInstaller@1
            displayName: "Terraform install"
            inputs:
              terraformVersion: 'latest'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'sc_azuredevops'
              backendAzureRmStorageAccountName: 'examplestorageacctnsajda'
              backendAzureRmContainerName: 'terraform-files'
              backendAzureRmKey: 'terraform-allfiles'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'validate'
          - task: TerraformTask@5
            displayName: "Terraform Plan"
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: 'sc_azuredevops'
              arguments: '-out=$(Build.ArtifactStagingDirectory)/tfplan'
          - task: PublishBuildArtifacts@1
            displayName: "Publish Plan Artifact"
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/tfplan'
              ArtifactName: 'drop'
              publishLocation: 'Container'
  - stage: tfdeploy
    condition: succeeded ('TerraformPlan')
    dependsOn: TerraformPlan
    jobs:
      - job: TerraformApply
        steps:
          - task: TerraformInstaller@1
            displayName: "Terraform install"
            inputs:
              terraformVersion: 'latest'
          - task: DownloadBuildArtifacts@1
            displayName: "Download Plan Artifact"
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'drop'
              downloadPath: '$(System.DefaultWorkingDirectory)'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'sc_azuredevops'
              backendAzureRmStorageAccountName: 'examplestorageacctnsajda'
              backendAzureRmContainerName: 'terraform-files'
              backendAzureRmKey: 'terraform-allfiles'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'apply'
              environmentServiceNameAzureRM: 'sc_azuredevops'
              arguments: '$(System.DefaultWorkingDirectory)/drop/tfplan'




      
